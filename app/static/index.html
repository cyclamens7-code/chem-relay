<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>화학물질 유해성 조회 콘솔 (NAS)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{--ink:#15171c;--paper:#f7f5f0;--card:#fff;--steel:#5a6472;--line:#e4e1d9;
--hazard:#b23b2e;--hazard-bg:#fbeeec;--amber:#a9761a;--amber-bg:#faf1dd;--verify:#20706f;--verify-bg:#e4f1f0;--focus:#3a67c4}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Inter","Pretendard",sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
.mono{font-family:"JetBrains Mono",monospace;font-feature-settings:"tnum"}
button{font-family:inherit;cursor:pointer}
.console{background:var(--ink);color:#eae7df;padding:34px 24px 30px;border-bottom:3px solid var(--hazard)}
.ci{max-width:1080px;margin:0 auto}
.brandrow{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.brand{font-family:"Space Grotesk";font-weight:700;font-size:20px;color:#fff}
.brand .dot{color:var(--hazard)}
.tagline{font-size:12.5px;color:#9aa1ad;font-family:"JetBrains Mono";letter-spacing:.02em}
.subnote{font-size:12px;color:#8a919d;margin:0 0 20px}.subnote b{color:#cdd2da}
.sw{display:flex;gap:10px;flex-wrap:wrap}.sf{flex:1 1 340px;position:relative}
.sf input{width:100%;padding:15px 16px 15px 46px;border:0;border-radius:2px;background:#0d0e12;color:#fff;font-size:16px;font-family:"JetBrains Mono";outline:2px solid #2c303b}
.sf input::placeholder{color:#6b7280;font-family:"Inter","Pretendard"}.sf input:focus{outline:2px solid var(--focus)}
.sf svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);opacity:.55}
.sb{padding:0 26px;border:0;border-radius:2px;background:var(--hazard);color:#fff;font-weight:600;font-size:15px}
.sb:hover{background:#c84437}.sb:disabled{opacity:.5;cursor:wait}
.hint{margin-top:11px;font-size:12px;color:#8a919d;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hint code{background:#0d0e12;padding:3px 9px;border-radius:2px;color:#c7ccd4;font-family:"JetBrains Mono";cursor:pointer}.hint code:hover{color:#fff}
main{max-width:1080px;margin:0 auto;padding:0 24px 80px}
.empty{padding:40px 0}.nodb{background:var(--verify-bg);border:1px solid #bcdedc;border-radius:4px;padding:16px 18px;font-size:13px;color:#1f4c4b}.nodb b{color:var(--verify)}
.target{background:var(--card);border:1px solid var(--line);border-radius:4px;margin-top:20px;overflow:hidden;box-shadow:0 8px 30px -20px rgba(0,0,0,.3)}
.idhead{padding:22px 24px;display:flex;gap:24px;flex-wrap:wrap}
.struct{width:150px;height:150px;flex:none;border:1px solid var(--line);border-radius:4px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}
.struct img{max-width:100%;max-height:100%}.struct .ph{font-size:11px;color:var(--steel);text-align:center;padding:8px;line-height:1.5}
.idmain{flex:1 1 320px;min-width:260px}
.idname{font-family:"Space Grotesk";font-size:21px;font-weight:600;line-height:1.25}
.idname small{display:block;font-family:"Inter","Pretendard";font-size:13px;font-weight:400;color:var(--steel);margin-top:3px}
.idkv{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:4px;margin-top:14px;overflow:hidden}
.idkv .cell{background:#fff;padding:9px 12px}.idkv .k{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--steel);font-weight:600}.idkv .v{font-size:13.5px;margin-top:2px;word-break:break-word}
.source-note{font-size:11px;color:var(--steel);padding:0 24px 16px;display:flex;align-items:center;gap:7px}
.livepill{font-family:"JetBrains Mono";font-size:10px;font-weight:600;color:#fff;background:var(--verify);padding:2px 8px;border-radius:99px}
.section{background:var(--card);border:1px solid var(--line);border-radius:4px;margin-top:16px;overflow:hidden}
.sh{display:flex;align-items:center;gap:14px;padding:16px 22px;cursor:pointer;user-select:none}.sh:hover{background:#faf9f6}
.sn{font-family:"JetBrains Mono";font-weight:700;font-size:13px;color:#fff;background:var(--ink);width:26px;height:26px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:3px}
.st{font-family:"Space Grotesk";font-weight:600;font-size:16.5px;flex:1}
.sfl{font-family:"JetBrains Mono";font-size:9.5px;font-weight:600;padding:3px 8px;border-radius:99px}.sfl.auto{background:var(--verify-bg);color:var(--verify)}.sfl.link{background:#f2f0ec;color:var(--steel)}
.chev{transition:transform .22s;opacity:.5}.section.open .chev{transform:rotate(90deg)}
.sbody{display:none;padding:4px 22px 24px;border-top:1px solid var(--line)}.section.open .sbody{display:block}
.si{color:var(--steel);font-size:13px;margin:14px 0 16px;max-width:66ch}
.block{margin:14px 0}.block h4{font-size:13px;margin:0 0 7px;display:flex;align-items:center;gap:8px}.block h4 .tick{width:6px;height:6px;border-radius:1px;flex:none}
.block ul{margin:6px 0 8px;padding-left:18px}.block li{font-size:13.5px;margin:4px 0;color:#2c2f36}
.evidence{border-left:3px solid var(--verify);background:var(--verify-bg);padding:11px 14px;border-radius:0 3px 3px 0;margin:10px 0;font-size:12.5px}
.evidence .lab{font-weight:600;color:var(--verify);font-size:11px;letter-spacing:.05em;text-transform:uppercase}
.inference{border-left:3px solid var(--amber);background:var(--amber-bg);padding:11px 14px;border-radius:0 3px 3px 0;margin:10px 0;font-size:12.5px}
.inference .lab{font-weight:600;color:var(--amber);font-size:11px;letter-spacing:.05em;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
.chip{font-family:"JetBrains Mono";font-size:12px;font-weight:500;padding:5px 10px;border-radius:3px;border:1px solid}
.chip.haz{color:var(--hazard);background:var(--hazard-bg);border-color:#eccbc6}.chip.warn{color:var(--amber);background:var(--amber-bg);border-color:#ead9b4}.chip.neutral{color:var(--steel);background:#f2f0ec;border-color:var(--line)}
.pictos{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}.picto{display:flex;flex-direction:column;align-items:center;gap:4px;width:74px;text-align:center}
.picto .dia{width:52px;height:52px;transform:rotate(45deg);border:2.5px solid var(--hazard);border-radius:6px;background:#fff;display:flex;align-items:center;justify-content:center}.picto .dia span{transform:rotate(-45deg);font-size:22px}.picto small{font-size:10px;color:var(--steel);line-height:1.2}
.signal{display:inline-block;font-family:"Space Grotesk";font-weight:700;font-size:15px;padding:4px 14px;border-radius:3px}.signal.danger{background:var(--hazard);color:#fff}.signal.warning{background:var(--amber);color:#fff}
.tbl{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px}
.tbl th{text-align:left;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--steel);font-weight:600;padding:8px 10px;border-bottom:2px solid var(--line)}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}.tbl tr:hover td{background:#faf9f6}
.hcode{font-family:"JetBrains Mono";font-weight:700;color:var(--hazard);white-space:nowrap}
.gradechip{display:inline-block;font-family:"JetBrains Mono";font-size:12px;font-weight:700;color:#fff;background:var(--hazard);padding:2px 9px;border-radius:99px;white-space:nowrap}
.altname{display:inline-block;font-size:12px;background:#f2f0ec;border:1px solid var(--line);border-radius:3px;padding:2px 7px;margin:2px 4px 2px 0}
.regstatus{color:var(--hazard);font-weight:600}
.othernames{display:block;font-size:12px;color:var(--steel);font-weight:400;margin-top:4px;line-height:1.5}
.hazsum{margin:10px 0;padding-left:20px}.hazsum li{margin:6px 0;font-size:13.5px}
.src{font-size:11.5px;color:var(--steel)}.src b{color:var(--ink);font-weight:600}
.dbname{font-family:"JetBrains Mono";font-size:11.5px;color:var(--verify);font-weight:500;text-decoration:none}.dbname:hover{text-decoration:underline}
.gt{font-family:"Space Grotesk";font-weight:600;font-size:13.5px;margin:20px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}
.gt .badge{font-family:"JetBrains Mono";font-size:10px;font-weight:600;color:#fff;background:var(--steel);padding:2px 7px;border-radius:3px}
.items{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.item{font-size:12px;padding:5px 10px;border:1px solid var(--line);border-radius:3px;background:#fcfbf9;color:#3a3f47}
.dbgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(184px,1fr));gap:7px;margin-top:6px}
.dblink{display:flex;align-items:center;gap:8px;text-decoration:none;border:1px solid var(--line);border-left-width:4px;border-radius:3px;padding:9px 11px;background:#fff;font-size:12px;transition:border-color .15s,background .15s}
.dblink:hover{border-color:var(--ink);background:#fbfaf7}
.dblink.direct{border-left-color:var(--verify);background:#f2fbfa}
.dblink.copy{border-left-color:#c9a24a;background:#fdfaf3}
.dblink .glyph{width:22px;height:22px;flex:none;border-radius:4px;display:flex;align-items:center;justify-content:center;font-family:"JetBrains Mono";font-size:12px;font-weight:700}
.dblink.direct .glyph{background:var(--verify);color:#fff}.dblink.copy .glyph{background:#c9a24a;color:#fff}
.dblink .lbl{flex:1;line-height:1.25;color:var(--ink)}.dblink .arrow{opacity:.35;flex:none}.dblink:hover .arrow{opacity:.8}
.leg{font-size:11px;color:var(--steel);margin:14px 0 4px;display:flex;gap:16px;flex-wrap:wrap}.leg span{display:inline-flex;align-items:center;gap:6px}
.orgrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.orgcard{display:block;text-decoration:none;border:1px solid var(--line);border-top:3px solid var(--verify);border-radius:4px;padding:12px 14px;background:#fff}
.orgcard:hover{background:#fbfaf7}
.orgcard .k{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--steel);font-weight:700}
.orgcard .v{font-size:13.5px;font-weight:600;color:var(--ink);margin-top:2px}
.orgcard .s{font-size:11.5px;color:var(--steel);margin-top:3px}
@media(max-width:560px){.orgrow{grid-template-columns:1fr}}
.invbox{border:1px solid var(--line);border-radius:5px;padding:14px 16px;margin:14px 0;background:#fcfbf9}
.invhead{font-family:"Space Grotesk";font-weight:600;font-size:14px;margin-bottom:8px}
.invrow{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.invlbl{font-weight:600;min-width:90px}
.invok{display:inline-block;background:var(--verify);color:#fff;font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px}
.invno{display:inline-block;background:#eee;color:var(--steel);font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px}
.stnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.stnbtn{display:block;text-decoration:none;border:1px solid #2c3550;border-left:4px solid #2c3550;border-radius:4px;padding:11px 14px;background:#1f2740;color:#eaf0ff;font-size:13px}
.stnbtn.alt{background:#2a3350;border-color:#3a4568}
.stnbtn:hover{background:#28324f}
.stnbtn b{font-family:"JetBrains Mono";letter-spacing:.02em}
.stnbtn .opennote{display:block;font-size:11px;color:#9fb0d8;margin-top:3px}
@media(max-width:560px){.stnrow{grid-template-columns:1fr}}
.leg .g{width:16px;height:16px;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;font-family:"JetBrains Mono";font-size:9px;font-weight:700}.g.direct{background:var(--verify-bg);color:var(--verify)}.g.copy{background:#f2f0ec;color:var(--steel)}
.loading{display:flex;align-items:center;gap:10px;color:var(--steel);font-size:13px;padding:10px 0}
.spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--verify);border-radius:50%;animation:sp .7s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.errbox{background:var(--amber-bg);border:1px solid #ead9b4;border-radius:4px;padding:12px 14px;font-size:12.5px;color:#6d4c12}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:4px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:50;box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.toast .cas{font-family:"JetBrains Mono";color:#f4d38a}
.genbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--amber-bg);border:1px solid #ead9b4;border-radius:4px;padding:12px 14px;margin-bottom:14px}
.genbar .txt{font-size:12.5px;color:#6d4c12;flex:1;min-width:180px}
.genbtn{background:var(--amber);color:#fff;border:0;border-radius:3px;padding:8px 16px;font-size:13px;font-weight:600;white-space:nowrap}
.genbtn:hover{background:#956613}.genbtn:disabled{opacity:.55;cursor:wait}
.conf{display:inline-block;font-family:"JetBrains Mono";font-size:10px;font-weight:600;padding:2px 8px;border-radius:99px;margin-left:6px}
.conf.high{background:var(--verify-bg);color:var(--verify)}.conf.medium{background:var(--amber-bg);color:var(--amber)}.conf.low{background:var(--hazard-bg);color:var(--hazard)}
.disclaimer{margin-top:26px;font-size:11.5px;color:var(--steel);line-height:1.6;border-top:1px solid var(--line);padding-top:16px}
@media(max-width:640px){.struct{width:120px;height:120px}}
</style>
</head>
<body>
<header class="console"><div class="ci">
  <div class="brandrow"><div class="brand">유해성 조회 콘솔<span class="dot">.</span></div><div class="tagline">NAS 중계 서버 · CAS·물질명 → 실제 자료 자동 표시</div></div>
  <p class="subnote">이 콘솔은 <b>내 NAS의 중계 서버</b>가 대신 조회한 자료를 표시합니다. 브라우저 CORS 제약이 없습니다.</p>
  <div class="sw"><div class="sf">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8a919d" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="q" type="text" placeholder="CAS 번호나 물질명 입력 후 Enter  (예: 71-43-2, benzene)" autocomplete="off" spellcheck="false">
  </div><button class="sb" id="go">조회</button></div>
  <div class="hint">빠른 시도:
    <code data-fill="71-43-2">벤젠 71-43-2</code>
    <code data-fill="50-00-0">폼알데하이드 50-00-0</code>
    <code data-fill="97926-71-1">예시 97926-71-1</code>
  </div>
</div></header>

<main id="main">
  <div class="empty"><div class="nodb"><b>검색 즉시 자동 조회.</b> CAS·물질명을 넣으면 기본정보·구조식·GHS·기존/신규·유해성심사·지정물질 현황과 규제·우려까지 자동으로 채웁니다. 확정 자료(고시 대조)와 AI 추정은 색으로 구분됩니다.</div></div>
</main>
<div class="toast" id="toast"></div>

<script>
const API = "/api/chem";  // 같은 NAS에서 서비스 → 상대경로

const DB={
  kreach:{name:"기후에너지환경부 화학물질정보처리시스템",url:"https://kreach.mcee.go.kr/repwrt/index.do"},
  kreach_search:{name:"기후에너지환경부 통합검색(KE-No. 확인)",url:"https://kreach.mcee.go.kr/repwrt/index.do"},
  kreach_open:{name:"화학물질 정보공개(기후에너지환경부)",url:"https://kreach.mcee.go.kr/repwrt/mttrInfoOpen/mttrInfoOpenList.do"},
  kosha:{name:"고용노동부 MSDS(안전보건공단)",url:"https://msds.kosha.or.kr/MSDSInfo/"},
  nfa:{name:"소방청 국가위험물통합정보",url:"https://hazmat.nfa.go.kr/"},
  nifds:{name:"식약처 독성정보시스템",url:"https://www.nifds.go.kr/toxinfo/tcd/initial/list.do"},
  echa:{name:"ECHA CHEM",url:"https://chem.echa.europa.eu/"},
  echa_clh:{name:"EU CLP 조화분류(CLH)",url:"https://chem.echa.europa.eu/activity-lists/clhProcess?pageIndex=1&pageSize=100"},
  echa_rar:{name:"EU RAR 위해성평가",url:"https://echa.europa.eu/information-on-chemicals/information-from-existing-substances-regulation"},
  iarc:{name:"IARC Monograph",url:"https://monographs.iarc.who.int/list-of-classifications/"},
  ntp:{name:"US NTP(RoC)",url:"https://ntp.niehs.nih.gov/whatwestudy/assessments/cancer/roc/index.html"},
  epa_iris:{name:"US EPA IRIS",url:"https://cfpub.epa.gov/ncea/iris/search/index.cfm"},
  atsdr:{name:"US ATSDR",url:"https://wwwn.cdc.gov/TSP/INDEX.ASPX"},
  ecotox:{name:"US ECOTOX",url:"https://cfpub.epa.gov/ecotox/search.cfm"},
  comptox:{name:"US EPA CompTox",url:"https://comptox.epa.gov/dashboard/",query:"https://comptox.epa.gov/dashboard/search-results?search="},
  pubchem:{name:"PubChem 전체 레코드",url:"https://pubchem.ncbi.nlm.nih.gov/",query:"https://pubchem.ncbi.nlm.nih.gov/#query="},
  cas_cc:{name:"CAS Common Chemistry",url:"https://commonchemistry.cas.org/",query:"https://commonchemistry.cas.org/results?q="},
  nite:{name:"일본 NITE CHRIP",url:"https://www.chem-info.nite.go.jp/chem/chrip/chrip_search/srhInput"},
  jcheck:{name:"일본 J-CHECK",url:"https://www.nite.go.jp/chem/jcheck/search.action?request_locale=ja"},
  aicis:{name:"호주 AICIS",url:"https://www.industrialchemicals.gov.au/chemical-information/search-assessments"},
  hcis:{name:"호주 HCIS",url:"https://hcis.safeworkaustralia.gov.au/HazardousChemical"},
  ccid:{name:"뉴질랜드 CCID",url:"https://www.epa.govt.nz/database-search/chemical-classification-and-information-database-ccid/"},
  oecd:{name:"OECD SIDS",url:"https://hpvchemicals.oecd.org/ui/Search.aspx"},
  echemportal:{name:"OECD eChemPortal",url:"https://www.echemportal.org/echemportal/substance-search"},
  scholar:{name:"Google Scholar",url:"https://scholar.google.com/",query:"https://scholar.google.com/scholar?q="},
  // STN / SciFinder (로그인 필요 → 검색 페이지 이동 + CAS 복사)
  stn:{name:"STN (CHEMLIST·Locator 등재확인)",url:"https://stn.org/"},
  scifinder:{name:"SciFinder-n",url:"https://scifinder-n.cas.org/"},
  // 글로벌 인벤토리 (무료 공식 검색)
  echa_ec:{name:"EU EC Inventory/EINECS",url:"https://echa.europa.eu/information-on-chemicals/ec-inventory"},
  dsl:{name:"캐나다 DSL",url:"https://pollution-waste.canada.ca/substances-search/Substance?lang=en"},
  aiic:{name:"호주 AIIC 인벤토리",url:"https://www.industrialchemicals.gov.au/search-inventory"},
  nzioc:{name:"뉴질랜드 NZIoC",url:"https://www.epa.govt.nz/database-search/new-zealand-inventory-of-chemicals-nzioc/"},
  // '(참고) 분류표시' 시트 1행 DB 중 기존 목록에 없던 것들
  echa_biocidal:{name:"ECHA Biocidal Assessment Report",url:"https://echa.europa.eu/information-on-chemicals/biocidal-active-substances"},

function _norm(s){return (s||"").replace(/\s+/g,"").replace(/[·ㆍ]/g,"");}
const HREV={};
Object.entries(HMAP).forEach(([h,v])=>{const dg=(v.g.match(/\d/)||[""])[0];HREV[_norm(v.c)+dg]=h;});
function hcodeFor(item,grade){
  const dg=(String(grade).match(/\d/)||[""])[0];
  let k=_norm(item)+dg;
  if(HREV[k])return HREV[k];
  if(_norm(item).includes("수생환경")){
    const chronic=/만성/.test(grade);
    k=_norm(chronic?"수생환경유해성-만성":"수생환경유해성-급성")+dg;
    if(HREV[k])return HREV[k];
  }
  return "";
}
// 국내 유해성심사 '분류 및 표시' 텍스트 → [{item, code, grade}]
function parseKGhs(text){
  if(!text) return [];
  const out=[];
  text.split(/\r?\n/).forEach(line=>{
    const t=line.trim();
    if(!t.startsWith("-")) return;
    if(t.includes("안전관리")||t.includes("준수")) return;
    // "- 적용 불가", "- 없음" 등은 분류 항목이 아니라 서술형 답변이므로 표에서 제외
    if(/^-\s*(적용\s*불가|없음|해당\s*없음)\s*$/.test(t)) return;
    // 예: "- 급성독성-경구(3.1) 구분 3"  /  "- 수생환경 유해성(4.1) 만성 구분 2"
    const m=t.match(/^-\s*(.+?)\s*\(([\d.]+)\)\s*(.*)$/);
    if(m){ out.push({item:m[1].trim(), code:m[2], grade:(m[3]||"").trim()}); }
    else { out.push({item:t.replace(/^-\s*/,''), code:"", grade:""}); }
  });
  return out;
}
// 마스터 함량기준 detail → [{label, criteria}]
function parseContent(detail){
  if(!detail) return [];
  return detail.split("/").map(seg=>{
    const i=seg.indexOf(":");
    if(i===-1) return null;
    return {label:seg.slice(0,i).trim(), criteria:seg.slice(i+1).trim()};
  }).filter(Boolean);
}

  if(id.iupac)kv.push(["IUPAC명",id.iupac,0]);
  $("#idkv").innerHTML=kv.map(([k,v,m])=>`<div class="cell"><div class="k">${k}</div><div class="v ${m?'mono':''}">${v}</div></div>`).join("");

  // 지정물질 현황 (파일 대조로 확정된 것 — 출처 포함)
  const desDetail=(d.notice&&d.notice.designated_detail)||"";
  const desBanner = des.length
    ? `<div class="evidence"><span class="lab">국내 지정물질 현황(확정)</span><div class="chips" style="margin-top:6px">${des.map(h=>`<span class="chip haz" title="${(h.source||'')} ${(h.note||'')}">${h.label}${h.note?` · ${h.note}`:''}</span>`).join("")}</div>${desDetail?`<div style="margin-top:7px;font-size:12px;white-space:pre-line">${desDetail}</div>`:""}<div class="src" style="margin-top:5px">출처: 화학물질 지정 마스터·고시 대조 · 파일에 없는 지정은 아래 2번에서 AI 추정</div></div>`
    : (d.q_is_cas?`<div class="inference"><span class="lab">국내 지정물질 현황</span> 대조된 지정물질이 없습니다. 2번 항목에서 AI 추정으로 보완됩니다.</div>`:"");

  // 기존/신규 판단 배너 — CAS No. 입력일 때만 자동판단(물질명은 혼합물 오판 우려로 보류)
  let existBanner="";
  if(!d.q_is_cas){
    existBanner=`<div class="inference"><span class="lab">화평법 구분</span> <b>CAS No. 기준 재확인 필요</b> — 물질명으로 검색되어 기존/신규 자동판단을 하지 않습니다. 물질명이 혼합물(A and B 형태)로 표기된 경우 성분 하나의 CAS로 잘못 매칭되어 오판될 수 있습니다. 가능하면 <b>CAS No.로 다시 검색</b>하고, 혼합물 여부는 화학물질정보처리시스템에서 직접 확인하세요.
      <div style="margin-top:8px">${dbLinks(["kreach_open"])}</div></div>`;
  }else if(nx.is_existing){
    existBanner=`<div class="evidence"><span class="lab">화평법 구분</span> <b>기존화학물질</b> — 기존화학물질 고시 ${nx.table} 수록 (고유번호 ${nx.keno}). <span class="src">출처: 기존화학물질 고시(별표 대조) · CAS No. ${id.cas||Q} 기준</span></div>`;
  }else if(d.notice){
    existBanner=`<div class="inference"><span class="lab">화평법 구분</span> <b>신규화학물질로 추정</b> — 기존화학물질 목록(별표1~3)에서 CAS No. ${id.cas||Q} 미검색. 단, 고시 제3조(수화물·무수물, 반응생성물, 이성질체) 해당 시 기존으로 인정될 수 있어 확인 필요. <span class="src">CAS No. 기준 판단(물질명은 참고만)</span></div>`;
  }
  // 이성질체·무수물·수화물 매칭 — 이미 기존화학물질로 완전일치된 경우는 제외(자기 자신과의 중복 경고 방지)
  const iso=(d.q_is_cas&&!nx.is_existing&&d.isomer_check)||{};
  let isoBanner="";
  if(iso.matched && (iso.candidates||[]).length){
    isoBanner=`<div class="inference"><span class="lab">⚠ 기존화학물질 등재 추가 검토 필요</span> 이 CAS의 물질명에서 이성질체 표기(cis/trans/(E)/(Z))·수화물·무수물 표기를 제외한 이름이 기존화학물질 목록의 다른 CAS와 일치합니다. 고시 제3조(수화물·무수물·반응생성물·이성질체) 해당 여부를 <b>반드시 화학물질정보처리시스템에서 확인</b>하세요.
      <ul style="margin:8px 0 4px;padding-left:18px">${iso.candidates.map(c=>`<li><b>${c.name||''}</b> — CAS ${c.cas} (${c.keno||''}${c.table?`, ${c.table}`:''})</li>`).join("")}</ul>
      <div style="margin-top:6px">${dbLinks(["kreach_open"])}</div></div>`;
  }
  const existBannerAll = existBanner + isoBanner + desBanner;

  $("#sec1").innerHTML=`${d.note?`<div class="inference"><span class="lab">참고</span> ${d.note}</div>`:""}
    ${existBannerAll}
    <table class="tbl"><tr><td style="width:120px"><b>물질명</b></td><td>${id.title||Q}</td></tr>
    <tr><td><b>이명 (Other name)</b></td><td>${(id.other_names&&id.other_names.length)?id.other_names.map(n=>`<span class="altname">${n}</span>`).join(""):'<span class="src">확인된 이명 없음</span>'}<div class="src" style="margin-top:3px">출처: ${id.source_label||"PubChem"} 이명(동의어) 목록</div></td></tr>
    <tr><td><b>CAS No.</b></td><td class="mono">${id.cas||"—"}</td></tr>
    <tr><td><b>기존/신규화학물질</b></td><td>${est.kind==="existing"?`<span class="invok">${est.label}</span>`:est.kind==="review"?`<span class="chip warn">${est.label}</span>`:`<span class="chip neutral">${est.label}</span>`}${est.detail?`<div class="src" style="margin-top:5px">${est.detail}</div>`:""}${est.kind==="review"?`<div class="src" style="margin-top:3px">고시 제3조(수화물·무수물·반응생성물·이성질체) 해당 여부는 화학물질정보처리시스템에서 반드시 확인하세요.</div>`:""}</td></tr>
    ${id.ec?`<tr><td><b>EC No.</b></td><td class="mono">${id.ec}</td></tr>`:""}
    <tr><td><b>화학식</b></td><td class="mono">${id.formula||"—"}</td></tr>
    ${id.iupac?`<tr><td><b>IUPAC명</b></td><td>${id.iupac}</td></tr>`:""}
    ${id.smiles?`<tr><td><b>SMILES</b></td><td class="mono" style="word-break:break-all">${id.smiles}</td></tr>`:""}
    ${id.inchikey?`<tr><td><b>InChIKey</b></td><td class="mono">${id.inchikey}</td></tr>`:""}
    ${id.cid?`<tr><td><b>PubChem CID</b></td><td class="mono">${id.cid}</td></tr>`:""}</table>
    <div class="evidence"><span class="lab">참고자료 출처</span> ${id.source_label||d.source||"NAS 중계 서버"}${(id.source_no===1)?' <span class="src">(2순위 PubChem으로 IUPAC명·구조식·CID 보완)</span>':''} · 기존/신규 판단: ${d.q_is_cas?"CAS No. 기준 · 기존화학물질 고시 대조":"물질명 검색(자동판단 보류)"}</div>
    <div class="src" style="margin:12px 0 2px">식별정보·KE-No. 교차확인</div>${legend}${dbLinks(GROUPS.ident)}`;
  // GHS
  const sts=g.statements||[];
  // 국내 유해성심사 분류(카테고리+구분) / 함량기준 파싱
  const kghs = parseKGhs((d.notice&&d.notice.review&&d.notice.review.classification)||"");
  const content = parseContent((d.notice&&d.notice.designated_detail)||"");
  const domRows = kghs.map(x=>({item:x.item, code:x.code, grade:x.grade, h:hcodeFor(x.item,x.grade)}));
  const classRef = d.classification_ref||[];   // '(참고) 분류표시' 시트 추출본: [{category,item,grade,db,source_url}]
  const clhRows = classRef.filter(x=>/EU CLP\(Harmonised/i.test(x.db||""));   // EU CLH(조화분류)
  const kreach = d.kreach||{};
  const kreachHaz = kreach.hazard||[];

  // 1) 국내 유해성심사 결과
  let ghsHtml = `<div class="gt" style="margin-top:0">1) 국내 유해성심사 결과<span class="badge">기후에너지환경부 고시</span></div>`;
  if(domRows.length){
    ghsHtml += `<p class="si">국내 유해성심사결과 고시(별표) 기준 GHS 분류·표시입니다.</p>
      <table class="tbl"><thead><tr><th>유해성 분류 (항목)</th><th style="width:150px">구분</th><th style="width:90px">H-code</th></tr></thead><tbody>
      ${domRows.map(x=>`<tr><td>${x.item}${x.code?` <span class="src">(${x.code})</span>`:""}</td><td><span class="gradechip">${x.grade||"—"}</span></td><td>${x.h?`<span class="hcode">${x.h}</span>`:"—"}</td></tr>`).join("")}
      </tbody></table>
      <div class="evidence"><span class="lab">출처</span> 화학물질의 유해성심사결과 고시(별표) · 기후에너지환경부</div>`;
  } else {
    ghsHtml += `<div class="errbox">국내 유해성심사결과 고시(별표)에서 확인된 분류가 없습니다.</div>`;
  }
  if(content.length){
    ghsHtml+=`<div class="src" style="margin:16px 0 6px"><b>혼합물 함량기준</b> (지정물질별)</div>
      <table class="tbl"><thead><tr><th style="width:150px">구분</th><th>함량기준</th></tr></thead><tbody>
      ${content.map(c=>`<tr><td><span class="chip haz">${c.label}</span></td><td>${c.criteria}</td></tr>`).join("")}
      </tbody></table>
      <div class="src" style="margin-top:5px">출처: 화학물질 지정 마스터(기후에너지환경부 자료)의 유해특성분류·혼합물 함량기준</div>`;
  }

  // 2) 기타 국외 유해성 분류 및 표시
  ghsHtml += `<div class="gt">2) 기타 국외 유해성 분류 및 표시<span class="badge">DB별 대조</span></div>`;
  ghsHtml += renderLiveOverseasClassification(d);
  if(classRef.length){
    ghsHtml += `<table class="tbl"><thead><tr><th>유해성 분류 (항목)</th><th style="width:130px">구분</th><th style="width:90px">H-code</th><th>출처</th></tr></thead><tbody>
      ${classRef.map(x=>{const h=hcodeFor(x.item,x.grade);return `<tr><td>${x.item}</td><td><span class="gradechip">${x.grade||"—"}</span></td><td>${h?`<span class="hcode">${h}</span>`:"—"}</td><td>${x.source_url?`<a class="dbname" href="${x.source_url}" target="_blank" rel="noopener">${x.db}</a>`:`<span class="src">${x.db}</span>`}</td></tr>`;}).join("")}
      </tbody></table>
      <div class="src" style="margin-top:5px">출처: 물질별 제출 자료('참고 분류표시' 시트) — 자동 대조된 값입니다. 시트에 미기재된 DB는 자동 반영되지 않으니 아래 DB에서 직접 교차 확인하세요.</div>`;
  } else {
    ghsHtml += `<div class="errbox">이 물질은 제출 자료('참고 분류표시' 시트)에서 자동 대조된 국외 DB 분류가 없습니다. 신규 조회 물질이거나 시트가 비어있는 경우입니다 — 아래 DB에서 직접 확인하세요.</div>`;
  }
  ghsHtml += `<p class="si" style="margin:14px 0 8px">'(참고) 분류표시' 시트 1행 기준 국외 유해성 분류 DB(EU CLP·덴마크 CLP 포함) — 자동 대조 여부와 무관하게 직접 검색용으로 항상 제공됩니다.</p>${dbLinks(GROUPS.classificationRefDbs)}`;
  if(kreachHaz.length){
    ghsHtml += `<div class="src" style="margin:16px 0 6px"><b>화학물질정보처리시스템 신고ㆍ등록 정보</b></div>
      <table class="tbl"><thead><tr><th style="width:70px">구분</th><th>유해성 분류(항목)</th><th style="width:110px">등급</th><th>유해ㆍ위험문구</th></tr></thead><tbody>
      ${kreachHaz.map(x=>`<tr><td><span class="chip ${x.tab==='등록'?'warn':'neutral'}">${x.tab} 정보</span></td><td>${x.item||""}</td><td><span class="gradechip">${x.grade||"—"}</span></td><td>${x.hcode_text||""}</td></tr>`).join("")}
      </tbody></table>
      <div class="src" style="margin-top:5px">출처: 화학물질정보처리시스템(KREACH) 정보공개 — ${kreachHaz.map(x=>x.tab).filter((v,i,a)=>a.indexOf(v)===i).join("ㆍ")} 정보 탭</div>`;
  } else if(kreach.implemented && kreach.reason!=="name_query"){
    ghsHtml += `<div class="src" style="margin:16px 0 4px">화학물질정보처리시스템 신고ㆍ등록 정보: 확인된 유해성 분류 신고·등록 자료 없음</div>`;
  }
  ghsHtml+=`<div class="src" style="margin:14px 0 2px">국내·조화분류 교차확인 DB</div>${dbLinks(["kreach","echa_clh","iarc","ntp","kosha"])}`;
  $("#sec3").innerHTML=ghsHtml;

  // 4번 유해성 요약 — 국내외에서 평가가 "완료"된 자료만: 국내 유해성심사 + EU CLH(조화분류)
  $("#sec4").innerHTML=summaryFromEvaluated(domRows, clhRows, sts, (d.echa_clp&&d.echa_clp.harmonised)||[]);
  // §2 국내 규제현황 상단에 유해성심사 결과 + 기후에너지환경부/고용노동부 분리 표시
  const sec2=$("#sec2");
  if(sec2 && d.notice){
    const rvBox = d.notice.name_query
      ? `<div class="inference"><span class="lab">국내 유해성심사</span> 물질명 검색이라 확인하지 않았습니다 — CAS No.로 다시 검색하세요.</div>`
      : nr.reviewed
      ? `<div class="evidence"><span class="lab">국내 유해성심사</span> <b>심사됨</b> (${nr.category||""}, 번호 ${nr.no||"—"}). 결과: <b>${nr.result||"—"}</b>. <span class="src">출처: 화학물질의 유해성심사결과 고시(별표) · 3번 항목에 분류·표시 상세</span></div>`
      : `<div class="inference"><span class="lab">국내 유해성심사</span> 유해성심사결과 고시(별표)에서 <b>미검색</b> — 심사 이력 미확인. 최신 고시·기후에너지환경부 DB에서 확인 권장.</div>`;
    const orgSplit = `<div class="orgrow">
      <a class="orgcard" href="${DB.kreach.url}" target="_blank" rel="noopener" onclick="dbClick(event,'kreach')"><div class="k">기후에너지환경부</div><div class="v">화학물질정보처리시스템 ↗</div><div class="s">한국환경공단·화학물질안전원 운영 · 기존화학물질·유해성심사</div></a>
      <a class="orgcard" href="${DB.kosha.url}" target="_blank" rel="noopener" onclick="dbClick(event,'kosha')"><div class="k">고용노동부</div><div class="v">KMS 물질안전보건자료(MSDS) ↗</div><div class="s">안전보건공단 · 산업안전보건법 분류·표시</div></a>
    </div>`;
    sec2.insertAdjacentHTML("afterbegin", rvBox + orgSplit);
    sec2.insertAdjacentHTML("beforeend", renderInventory(d.notice));
  }
  const sec5=$("#sec5");
  if(sec5) sec5.insertAdjacentHTML("afterbegin", renderKreachUses(d.kreach));
}

async function enrichDetail(){
  const box2=$("#enrich2"), box4=$("#enrich4");
  if(!box2) return;
  box2.innerHTML=`<div class="loading"><span class="spin"></span>Gemini가 규제·지정물질·우려를 자동 정리 중… (10~20초)</div>`;
  try{
    const r=await fetch(`/api/enrich?q=${encodeURIComponent(Q)}`);
    const res=await r.json();
    if(!res.ok){
      const msg = res.error==="no_api_key"
        ? "AI 자동 생성이 꺼져 있습니다(GEMINI_API_KEY 미설정). 규제현황은 아래 DB 링크로 직접 확인하세요."
        : (res.message||"생성 실패");
      box2.innerHTML=`<div class="inference"><span class="lab">안내</span> ${msg}</div>`;
      return;
    }
    const d=res.data||{};
    const conf=(d.confidence||"medium");
    const cbadge=`<span class="conf ${conf}">신뢰도 ${conf}</span>`;
    // 1. 기존/신규 판단(생성 초안) → §1 상단에 추가
    const en=d.existing_new;
    if(en && en.verdict){
      const cls = en.verdict.includes("기존")?"evidence":"inference";
      const html=`<div class="${cls}"><span class="lab">화평법 구분 (AI 판단)</span> <b>${en.verdict}</b>${en.keno?` · KE-No. ${en.keno}`:""} ${cbadge}<div style="margin-top:4px;font-size:12px">${en.basis||""}</div><div class="src" style="margin-top:3px">출처: ${en.source||"기존화학물질 고시"} · ⚠ AI 초안, 검수 필요</div></div>`;
      const sec1=$("#sec1"); if(sec1) sec1.insertAdjacentHTML("afterbegin", html);
    }
    // 지정물질 AI 추정 → §1에 추가 (파일 미대조분)
    const de=(d.designated_estimate||[]).filter(x=>x&&x.likely&&x.likely!=="아니오");
    if(de.length){
      const html=`<div class="inference"><span class="lab">지정물질 (AI 추정)</span><div class="chips" style="margin-top:6px">${de.map(x=>`<span class="chip ${x.likely==='예'?'haz':'warn'}" title="${x.basis||''}">${x.label} · ${x.likely}</span>`).join("")}</div><div class="src" style="margin-top:5px">⚠ AI 추정입니다. 확정은 기후에너지환경부 통합검색 등에서 확인하세요. ${de.map(x=>x.source).filter(Boolean).slice(0,2).join(" · ")}</div></div>`;
      const sec1=$("#sec1"); if(sec1) sec1.insertAdjacentHTML("beforeend", html);
    }
    // 2. 규제현황 표
    const regs=(d.regulations||[]);
    box2.innerHTML = (regs.length
      ? `<div style="margin-bottom:6px"><b style="font-size:13px">규제현황 (AI 생성)</b>${cbadge}${res._cache?'<span class="conf medium">캐시</span>':''}</div>
         <table class="tbl"><thead><tr><th>지역</th><th>규정/기관</th><th>상태</th><th>출처</th></tr></thead><tbody>
         ${regs.map(x=>`<tr><td><span class="chip neutral">${x.region||"—"}</span></td><td><b>${x.body||"—"}</b><div class="src">${x.detail||""}</div></td><td class="regstatus">${x.status||"—"}</td><td class="dbname">${x.source||"—"}</td></tr>`).join("")}
         </tbody></table>`
      : `<div class="inference"><span class="lab">결과</span> 명확한 규제현황을 특정하지 못했습니다. 아래 DB에서 직접 확인하세요.</div>`)
      + (d.caveat?`<div class="inference"><span class="lab">검수 주의</span> ${d.caveat}</div>`:"")
      + `<div class="src" style="margin-top:8px">⚠ AI 생성 초안입니다. 게시 전 출처 확인·검수를 권장합니다.</div>`;
    // 4. 국내 우려·노출경로
    const dm=d.domestic||{};
    box4.innerHTML=`
      ${(dm.issue&&dm.issue.length)?`<div class="block"><h4><span class="tick" style="background:var(--hazard)"></span>국내 우려 이슈 ${cbadge}</h4><ul>${dm.issue.map(i=>`<li>${i}</li>`).join("")}</ul></div>`:""}
      ${(dm.uses&&dm.uses.length)?`<div class="block"><h4><span class="tick" style="background:var(--ink)"></span>주요 용도</h4><div class="chips">${dm.uses.map(u=>`<span class="chip neutral">${u}</span>`).join("")}</div></div>`:""}
      ${(dm.routes&&dm.routes.length)?`<div class="block"><h4><span class="tick" style="background:var(--ink)"></span>노출경로</h4><table class="tbl">${dm.routes.map(x=>`<tr><td style="width:80px"><b>${x.r||"—"}</b></td><td>${x.d||""}</td></tr>`).join("")}</table></div>`:""}
      ${(dm.tox&&dm.tox.length)?`<div class="block"><h4><span class="tick" style="background:var(--hazard)"></span>우려 독성</h4><div class="chips">${dm.tox.map(t=>`<span class="chip haz">${t}</span>`).join("")}</div></div>`:""}
      ${dm.source?`<div class="inference"><span class="lab">출처 / 성격</span> ${dm.source}</div>`:""}
      <div class="src">직접 확인용 국내 DB:</div>${dbLinks(GROUPS.domestic)}`;
  }catch(e){
    box2.innerHTML=`<div class="inference"><span class="lab">안내</span> 자동 생성 실패: ${e.message}. 아래 DB로 직접 확인하세요.</div>`;
  }
}

function run(){const v=input.value;if(!v.trim())return;lookup(v);}
goBtn.addEventListener("click",run);
input.addEventListener("keydown",e=>{if(e.key==="Enter")run();});
document.querySelectorAll(".hint code").forEach(c=>c.addEventListener("click",()=>{input.value=c.dataset.fill;run();}));
</script>
</body>
</html>
